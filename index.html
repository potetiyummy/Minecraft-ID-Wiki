<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>統合版 ブロック・アイテムID</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>統合版 ブロック・アイテムID</h1>
    <input id="search" type="search" placeholder="名前またはIDで検索">
    <button id="user-login" type="button">Googleでログイン</button>
    <input id="accent-picker" type="color" title="アクセントカラー" hidden>
    <button id="admin-toggle" type="button" hidden>管理者ログイン</button>
    <label id="remember-label" hidden>
      <input id="remember-device" type="checkbox">
      このデバイスでは管理者ログインなしで変更可能
    </label>
    <button id="logout" type="button" hidden>ログアウト</button>
  </header>

  <div id="admin-screen" hidden>
    <header class="admin-header">
      <h2>管理者ログイン</h2>
      <button id="admin-close" type="button">閉じる</button>
    </header>

    <section class="admin-body">
      <form id="login-form" class="admin-form">
        <input id="login-email" type="email" placeholder="メールアドレス" required>
        <input id="login-password" type="password" placeholder="パスワード" required>
        <button type="submit">ログイン</button>
        <p id="login-error" class="error"></p>
      </form>
    </section>
  </div>

  <main>
    <nav id="tree"></nav>
    <section id="detail">
      <p class="hint">左のカテゴリから選ぶか、検索してください。</p>
    </section>
  </main>

  <div id="folder-menu" class="context-menu" hidden>
    <button id="menu-rename" type="button">名前を変更</button>
    <button id="menu-delete" type="button">削除</button>
  </div>

  <div id="danger-confirm" class="danger-confirm" hidden>
    <p id="danger-message"></p>
    <p class="danger-note">削除するには、削除ボタンを5回押してください。ボタンからカーソルが外れたり、ほかの場所を操作したりすると、最初からになります。</p>
    <div class="danger-actions">
      <button id="danger-cancel" type="button">キャンセル</button>
      <button id="danger-button" type="button">削除（あと5回）</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
